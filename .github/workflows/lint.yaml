name: Lint

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  lint:
    name: Lint
    uses: mserajnik/docker-deploy-workflows/.github/workflows/shared-lint.yaml@v1
    with:
      shell-exclude: |
        docker/database/docker-entrypoint.sh
      compose-files: |
        compose-modules-bots.yaml.example
        compose-modules.yaml.example
        compose.yaml.example
