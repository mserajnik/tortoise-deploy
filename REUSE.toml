version = 1

[[annotations]]
path = [
  ".github/ISSUE_TEMPLATE/*",
  ".github/logo.webp",
  "README.md",
  "docker/docker-notice.txt",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Michael Serajnik <https://github.com/mserajnik>"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  ".dockerignore",
  ".dprint.jsonc",
  ".editorconfig",
  ".gitattributes",
  ".github/migration-edit-state.json",
  ".gitignore",
  ".hadolint.yaml",
  ".shellcheckrc",
  "compose*.yaml.example",
  "config/**/*.conf.example",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Michael Serajnik <https://github.com/mserajnik>"
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = "docker/patches/**/*.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Tortoise-WoW <https://github.com/tortoise-wow/tortoise-wow>",
  "2026 Michael Serajnik <https://github.com/mserajnik>",
]
SPDX-License-Identifier = "GPL-2.0-or-later"

[[annotations]]
path = [
  "docker/patches/pin-migration-paths.patch",
  "docker/patches/use-installed-module-sql-path.patch",
]
precedence = "aggregate"
SPDX-FileCopyrightText = [
  "Tortoise-WoW <https://github.com/tortoise-wow/tortoise-wow>",
  "2026 Michael Serajnik <https://github.com/mserajnik>",
]
SPDX-License-Identifier = "AGPL-3.0-only AND GPL-2.0-or-later"
